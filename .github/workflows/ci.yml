name: CI

# Every push to master and every pull request: ateliertool check (the changelog and the roadmap, odin check -vet of the
# program for Linux and Windows and of the tool, the unit tests, a release build), then ateliertool live: the programs'
# latest releases in a bundle, and every one installed for real by atelier, in a home of its own. On Windows: check,
# then the release file made (the program and its bundle), kept as an artifact.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}   # (gh reads the programs' releases: ateliertool bundle)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://cache.froment.software

      - uses: actions/cache@v4
        with:
          path: ext/gui_toolkit/build/text
          key: text-linux-nix-${{ hashFiles('ext/gui_toolkit/native/text/**', 'flake.lock') }}

      # (the shell's dbus reads its session bus's configuration where NixOS keeps it, /etc/dbus-1, which this runner does not
      # have: a session bus of its own for sway's dbus-run-session)
      - name: dbus's session configuration
        run: |
          sudo mkdir -p /etc/dbus-1
          sudo tee /etc/dbus-1/session.conf >/dev/null <<'EOF'
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <auth>EXTERNAL</auth>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF

      # (the released programs that live starts itself take the distribution's libraries, as on a person's machine:
      # Vulkan with Mesa's software driver, fontconfig, Wayland)
      - name: the distribution's Vulkan for the released programs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 libfontconfig1 libwayland-client0 libxkbcommon0 >/dev/null

      # (Vulkan's drivers are in /run/opengl-driver on NixOS: here, Mesa's software one from the flake's nixpkgs)
      - name: lavapipe
        run: |
          mesa="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa | head -1)"
          echo "VK_DRIVER_FILES=$(find "$mesa" -name 'lvp_icd*.json' | head -1)" >> "$GITHUB_ENV"

      - name: ateliertool check, live
        run: |
          nix develop --command sh -c '
            set -e
            mkdir -p build
            odin build tools/ateliertool -collection:gt=ext/gui_toolkit/src -out:build/ateliertool -vet
            build/ateliertool check
            build/ateliertool live
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-linux-x64-${{ github.sha }}
          path: |
            build/atelier
            build/live/home/.local/share/applications/*.desktop
            build/live/window/*.log
            build/live/window/*.png
          if-no-files-found: warn

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./ext/gui_toolkit/.github/actions/setup-odin

      - name: ateliertool check, package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          odin build tools/ateliertool -collection:gt=ext/gui_toolkit/src -out:build/ateliertool.exe -vet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/ateliertool.exe check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/ateliertool.exe package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # (the release file reads its own bundle: list asks each program's --status, nothing is installed)
          $exe = (Get-ChildItem build/dist/atelier-*-windows-x64.exe).FullName
          & $exe list | Out-Host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-windows-x64-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: warn
